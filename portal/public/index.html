<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#07111d">
	<title>FastConnect | Wi-Fi plans</title>
	<link rel="stylesheet" href="assets/style.css">
</head>

<body>
	<header class="tenant-header">
		<a class="brand" href="index.html">
			<span class="brand-mark">F</span>
			<span class="brand-name">FastConnect</span>
		</a>
		<nav class="page-links" aria-label="Account navigation"><a class="quiet-link" href="account.html">Sign in / Create account</a><span class="network-state">Development preview</span></nav>
	</header>

	<main class="tenant-main">
		<p class="eyebrow">Welcome to your compound Wi-Fi</p>
		<h1>Choose your connection.</h1>
		<p class="lead">
			Choose a plan. Payments are disabled in this development version.
		</p>

		<p id="plans-message" class="form-message" role="status" aria-live="polite"></p>
		<section id="plan-grid" class="plan-grid" aria-label="Internet plans" aria-live="polite"></section>

		<div class="inline-note">
			<span>
				<strong>Development version:</strong>
				Payments and Wi-Fi access are not enabled here.
			</span>
		</div>

		<nav class="page-links" aria-label="Help links">
			<a class="quiet-link" href="status.html">Check connection status</a>
			<a class="quiet-link" href="help.html">Help &amp; payment guidance</a>
		</nav>
	</main>
	<script src="assets/app.js" defer></script>
</body>
</html>
